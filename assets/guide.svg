<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 670" role="img" aria-labelledby="title desc">
<title id="title">Service Excellence Guide — concept illustration</title>
<desc id="desc">Animated concept illustration based on the source report's headset-wearing female guide: a smiling Black Jamaican professional with braided hair, pale grey-blue blazer, white blouse, dark trousers and welcoming hands. Final character likeness requires client approval.</desc>
<defs>
  <linearGradient id="jacket" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f5fcfd"/><stop offset=".5" stop-color="#c9dde7"/><stop offset="1" stop-color="#839eaf"/></linearGradient>
  <linearGradient id="leftJ" x1=".3" y1="0" x2=".9" y2="1"><stop stop-color="#deeef3"/><stop offset="1" stop-color="#9ebccc"/></linearGradient>
  <linearGradient id="skin" x1=".2" y1="0" x2=".8" y2="1"><stop stop-color="#b87954"/><stop offset=".45" stop-color="#a56546"/><stop offset="1" stop-color="#75422f"/></linearGradient>
  <linearGradient id="face" x1=".1" y1=".1" x2=".9" y2="1"><stop stop-color="#d28b5d"/><stop offset=".56" stop-color="#b06b49"/><stop offset="1" stop-color="#925239"/></linearGradient>
  <linearGradient id="pant" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#223d58"/><stop offset="1" stop-color="#10263a"/></linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#171b2a"/><stop offset=".6" stop-color="#292c35"/><stop offset="1" stop-color="#080f1d"/></linearGradient>
  <linearGradient id="headset" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#465e78"/><stop offset="1" stop-color="#121f35"/></linearGradient>
  <radialGradient id="cheek"><stop stop-color="#f5b07b" stop-opacity=".62"/><stop offset="1" stop-color="#ed9e79" stop-opacity="0"/></radialGradient>
  <filter id="shadow"><feGaussianBlur stdDeviation="11"/></filter>
  <style>
    .pupil{animation:looking 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .blink{animation:blink 5.7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .speech{animation:speak 9s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
    .soft-wave{animation:wave 6s ease-in-out infinite;transform-origin:68% 64%;transform-box:fill-box}
    @keyframes blink{0%,43%,46%,100%{transform:scaleY(1)}44.5%{transform:scaleY(.11)}}
    @keyframes looking{0%,25%,100%{transform:translateX(0)}37%,43%{transform:translateX(-2px)}70%{transform:translateX(2px)}}
    @keyframes speak{0%,100%{transform:scaleY(1)}40%{transform:scaleY(.82)}47%{transform:scaleY(1.1)}}
    @keyframes wave{0%,70%,100%{transform:rotate(0deg)}80%{transform:rotate(2deg)}90%{transform:rotate(-2deg)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>
