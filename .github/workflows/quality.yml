name: Service Excellence preview quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: node qa/smoke.mjs
      - name: Run 2,000-case guide acceptance benchmark
        run: node qa/guide-benchmark.mjs
      - name: Test everyday visitor questions
        run: node qa/guide-everyday.mjs
      - name: Check report provenance and natural conversations
        run: node qa/guide-context.mjs
      - name: Check institutional knowledge and context
        run: node qa/guide-institution.mjs
      - name: Check unified retrieval and cross-domain conversation
        run: node qa/guide-retrieval.mjs
      - name: Test hybrid routing and model lifecycle
        run: node qa/guide-hybrid.mjs
      - name: Test automatic intelligence and constrained network fallback
        run: node qa/guide-auto.mjs
      - name: Check Ella ambassador conversation and tenant boundaries
        run: node qa/ambassador.mjs
      - name: Check for unexpected PDF files
        run: |
          if find . -type f -iname '*.pdf' -not -path './.git/*' -not -path './docs/Internal_CSAT_Report_2025_Final.pdf' | grep -q .; then
            echo "Unexpected PDF detected. Only the explicitly authorised source report is included."
            exit 1
          fi
